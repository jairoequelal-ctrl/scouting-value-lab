[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "scouting-value-lab"
version = "0.1.0"
description = "Historical football valuation modelling with temporal validation"
requires-python = ">=3.10"
dependencies = ["pandas>=2.2,<3", "numpy>=2,<3", "scikit-learn>=1.6,<2", "joblib>=1.4,<2", "streamlit>=1.40,<2", "matplotlib>=3.9,<4"]
[project.optional-dependencies]
dev = ["pytest>=8,<10"]
[tool.setuptools.packages.find]
where = ["src"]
